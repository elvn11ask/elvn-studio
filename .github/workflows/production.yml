name: Production
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Operator action"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - inventory
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: elvn-studio-production
  cancel-in-progress: false
jobs:
  inventory:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'inventory'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/studio_deploy
          chmod 600 ~/.ssh/known_hosts ~/.ssh/studio_deploy
      - name: Collect read-only production inventory
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -p "$VPS_PORT" -i ~/.ssh/studio_deploy "$VPS_USER@$VPS_HOST" 'sh -s' > production-inventory.txt <<'REMOTE'
          set -eu
          printf 'captured_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf 'operator_user=%s\n' "$(id -un)"
          printf 'hostname=%s\n' "$(hostname)"
          printf '\n[studio-release]\n'
          for path in /srv/elvn-studio/DEPLOYED_COMMIT /srv/elvn-studio/current /srv/elvn-studio/previous; do
            if [ -L "$path" ]; then printf '%s -> %s\n' "$path" "$(readlink -f "$path")"; elif [ -r "$path" ]; then printf '%s=%s\n' "$path" "$(sed -n '1p' "$path")"; else printf '%s=UNREADABLE_OR_ABSENT\n' "$path"; fi
          done
          printf '\n[revenueos-files]\n'
          for path in /srv/elvn-control-center /srv/control-center; do
            if [ -d "$path" ]; then find "$path" -maxdepth 2 -mindepth 1 -printf '%M %u:%g %p\n' 2>/dev/null | sort; else printf '%s=ABSENT\n' "$path"; fi
          done
          printf '\n[docker-ps]\n'
          docker ps --format '{{json .}}'
          printf '\n[docker-inspect]\n'
          for container in $(docker ps --format '{{.Names}}'); do
            docker inspect --format '{{json .Name}} {{json .Config.Image}} {{json .Image}} {{json .State.Status}} {{json .State.Health.Status}} {{json .HostConfig.RestartPolicy.Name}} {{json .Mounts}}' "$container" 2>/dev/null || true
          done
          printf '\n[docker-volumes]\n'
          docker volume ls --format '{{json .}}'
          printf '\n[nginx-process]\n'
          ps -eo user,pid,comm,args | grep '[n]ginx' || true
          REMOTE
          test -s production-inventory.txt
      - name: Upload protected inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-inventory-${{ github.run_id }}
          path: production-inventory.txt
          retention-days: 1

  release:
    if: github.event_name == 'push' || inputs.mode == 'deploy'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Build immutable image
        run: docker build --tag "elvn-studio:${GITHUB_SHA}" .
      - name: Export release
        run: |
          docker save "elvn-studio:${GITHUB_SHA}" | gzip -9 > elvn-studio-image.tar.gz
          tar -czf elvn-studio-release.tar.gz elvn-studio-image.tar.gz compose.production.yml deploy/nginx/studio.elvn.monster.conf
      - name: Configure SSH
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/studio_deploy
          chmod 600 ~/.ssh/known_hosts ~/.ssh/studio_deploy
      - name: Upload candidate
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: scp -P "$VPS_PORT" -i ~/.ssh/studio_deploy elvn-studio-release.tar.gz "$VPS_USER@$VPS_HOST:/tmp/elvn-studio-release.tar.gz"
      - name: Deploy, verify, and retain rollback
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: ssh -p "$VPS_PORT" -i ~/.ssh/studio_deploy "$VPS_USER@$VPS_HOST" "sudo /usr/local/sbin/elvn-studio-deploy /tmp/elvn-studio-release.tar.gz '${GITHUB_SHA}'"
      - name: Public smoke test
        run: |
          health=$(curl --fail --silent --show-error --retry 5 --retry-delay 5 https://studio.elvn.monster/api/health)
          printf '%s' "$health" | grep -q '"lifecycle":"ready"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'content-type: application/json' --data '{"leadId":"invalid","trackingToken":"invalid"}' https://studio.elvn.monster/api/revenueos-assessment/status)" = 403
          for route in / /work /services /contact /sitemap.xml /robots.txt /c8363361518e464ca28c62dd7a5e9d9d.txt; do
            curl --fail --silent --show-error --retry 3 "https://studio.elvn.monster${route}" > /dev/null
          done
      - name: Notify IndexNow
        run: pnpm indexnow:submit
