limit_req_zone $binary_remote_addr zone=studio_contact:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name studio.elvn.monster;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://studio.elvn.monster$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name studio.elvn.monster;
    ssl_certificate /etc/letsencrypt/live/studio.elvn.monster/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.elvn.monster/privkey.pem;
    access_log /var/log/nginx/elvn-studio.access.log;
    error_log /var/log/nginx/elvn-studio.error.log;
    client_max_body_size 128k;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    location /_next/static/ { proxy_pass http://127.0.0.1:__STUDIO_PORT__; proxy_cache_valid 200 365d; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location = /api/contact { limit_req zone=studio_contact burst=3 nodelay; proxy_pass http://127.0.0.1:__STUDIO_PORT__; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location / { proxy_pass http://127.0.0.1:__STUDIO_PORT__; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 30s; }
}
