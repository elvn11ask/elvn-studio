services:
  lifecycle-init:
    image: elvn-studio:${RELEASE_TAG:?RELEASE_TAG is required}
    user: "0:0"
    command: ["sh", "-c", "install -d -o 1001 -g 1001 -m 0700 /data"]
    volumes:
      - studio-lifecycle-data:/data
    read_only: true
    restart: "no"
    network_mode: none
  studio:
    image: elvn-studio:${RELEASE_TAG:?RELEASE_TAG is required}
    container_name: elvn-studio
    restart: unless-stopped
    env_file: /srv/elvn-studio/shared/studio.env
    depends_on:
      lifecycle-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${STUDIO_PORT:?STUDIO_PORT is required}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    volumes:
      - studio-lifecycle-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 384m
    cpus: 1.0
    networks:
      - elvn-studio-internal
  studio-outbox:
    image: elvn-studio:${RELEASE_TAG:?RELEASE_TAG is required}
    container_name: elvn-studio-outbox
    restart: unless-stopped
    command: ["node", "outbox-worker.mjs"]
    env_file: /srv/elvn-studio/shared/studio.env
    depends_on:
      lifecycle-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    volumes:
      - studio-lifecycle-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - elvn-studio-internal
networks:
  elvn-studio-internal:
    name: elvn-studio-internal
volumes:
  studio-lifecycle-data:
    name: elvn-studio-lifecycle-data
