slug: icprom
title: ICPROM
eyebrow: Industrial catalog runtime
summary: An industrial components catalog focused on durable technical navigation, scalable page generation, and fast server response.
problem: A broad component taxonomy creates expensive runtime work and fragile crawl behavior when every request recomputes the same structures.
solution: Immutable generated artifacts move stable navigation, summaries, facets, and page slices out of the critical request path.
outcome: A leaner production runtime with preserved URLs, clearer crawl paths, and a more predictable browsing experience.
